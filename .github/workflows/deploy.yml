name: Deploy to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Create .env file
        run: |
          echo "WEAVIATE_URL=${{ secrets.WEAVIATE_URL }}" > .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "READ_REPLICA_URL=${{ secrets.READ_REPLICA_URL }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "AMPLIFY_BUCKET=${{ secrets.AMPLIFY_BUCKET }}" >> .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo "NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}" >> .env
          echo "NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}" >> .env
          echo "NEXT_PUBLIC_SOCKET_API_BASE_URL=${{ secrets.NEXT_PUBLIC_SOCKET_API_BASE_URL }}" >> .env

      - name: Copy project to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "."
          target: "~/tonghana"
          rm: true
          strip_components: 0
          args: "-r --exclude=node_modules --exclude=.env.local"

      - name: Restart on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/tonghana

            # Node.js & npm 설치 (Ubuntu 기준)
            if ! command -v npm &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # pm2 설치 (글로벌)
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            cat <<EOF > .env
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            READ_REPLICA_URL=${{ secrets.READ_REPLICA_URL }}
            WEAVIATE_URL=${{ secrets.WEAVIATE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AMPLIFY_BUCKET=${{ secrets.AMPLIFY_BUCKET }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_SOCKET_API_BASE_URL=${{ secrets.NEXT_PUBLIC_SOCKET_API_BASE_URL }}
            EOF

            # 설치 및 빌드
            npm install --legacy-peer-deps
            npm install --save-dev openapi-types
            npm install graphql

            # Prisma client만 생성 (DB에는 영향 없음)
            npx prisma generate

            # 빌드 후 PM2로 실행
            npm run build

            pm2 restart tonghana || pm2 start npm --name "tonghana" -- start --cwd ~/tonghana
            export $(cat .env | xargs)
            pm2 restart chat || pm2 start "npx tsx chat-server.ts" --name "chat" --cwd ~/tonghana
